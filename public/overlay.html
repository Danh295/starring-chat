<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starring: Chat overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:ital,wght@0,700;0,800;1,700&display=swap">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="status">Starring: Chat is connected</div>
<div id="stage"></div>
<div id="credits" aria-hidden="true"></div>

<!-- Clapperboard shown for a moment before each reveal. Static markup, cloned by overlay.js. -->
<template id="clapper-tpl">
  <div class="clap" aria-hidden="true">
    <svg viewBox="0 0 220 160" width="190" height="138">
      <g class="clap-arm" style="transform-origin:12px 52px">
        <rect x="12" y="20" width="196" height="32" rx="4" fill="#111"/>
        <g fill="#f5f0e1">
          <polygon points="30,20 58,20 42,52 14,52"/><polygon points="86,20 114,20 98,52 70,52"/>
          <polygon points="142,20 170,20 154,52 126,52"/><polygon points="198,20 208,20 208,52 182,52"/>
        </g>
      </g>
      <rect x="12" y="56" width="196" height="92" rx="4" fill="#1b1b22" stroke="#f5f0e1" stroke-width="3"/>
      <g fill="#f5f0e1">
        <polygon points="12,56 40,56 26,72 12,72"/><polygon points="68,56 96,56 82,72 54,72"/>
        <polygon points="124,56 152,56 138,72 110,72"/><polygon points="180,56 208,56 208,72 194,72"/>
      </g>
      <text x="110" y="118" text-anchor="middle" font-family="Nunito, system-ui, sans-serif" font-weight="800" font-size="24" fill="#f5c542">casting...</text>
    </svg>
  </div>
</template>

<script src="overlay-core.js"></script>
<script src="overlay.js"></script>
</body>
</html>
